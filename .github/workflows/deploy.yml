name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; cancel superseded runs.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site (Next.js export)
        run: |
          rm -rf app/api src/app/api
          BUILD_EXPORT=1 bunx next build
          # Only /api/* should hit the Pages Functions; everything else is static.
          mkdir -p out
          echo '{"version":1,"include":["/api/*"],"exclude":[]}' > out/_routes.json

      - name: Ensure D1 database exists
        run: |
          bunx wrangler d1 create portfolio-db || true
          DB_ID=$(bunx wrangler d1 list --json | jq -r '
            (if type == "array" then . elif has("result") then .result else [.] end)
            | map(select(.name == "portfolio-db"))
            | .[0].uuid // empty')
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not resolve the D1 database id"
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml

      - name: Apply database schema
        run: bunx wrangler d1 execute portfolio-db --remote --file=sql/0000_init.sql -y

      - name: Seed database (first deploy only)
        run: |
          SEEDED=$(bunx wrangler d1 execute portfolio-db --remote --json \
            --command "SELECT COUNT(*) AS c FROM _meta WHERE key = 'seeded'" \
            | jq -r '(if type == "array" then .[0] else .result[0] end) | (.results // [])[0].c // 0')
          echo "seeded flag = $SEEDED"
          if [ "$SEEDED" = "0" ]; then
            echo "First deploy — seeding demo content + admin account…"
            bunx wrangler d1 execute portfolio-db --remote --file=sql/seed.sql -y
          else
            echo "Database already seeded — ensuring default avatar if empty..."
            bunx wrangler d1 execute portfolio-db --remote --command "UPDATE site_setting SET avatarUrl = '/images/avatar.svg' WHERE id = 'main' AND (avatarUrl IS NULL OR avatarUrl = '');" -y || true
          fi

      - name: Create Pages project (if needed)
        run: bunx wrangler pages project create mdsalahuddin --production-branch main || true

      - name: Deploy
        run: bunx wrangler pages deploy out --branch main

      - name: Summary
        run: |
          echo "### 🚀 Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://mdsalahuddin.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Admin: open the site → **Admin** button → login (default \`admin / admin123\` — change it immediately!)" >> $GITHUB_STEP_SUMMARY
